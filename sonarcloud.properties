sonar.projectKey=multitenant-saas-api
sonar.organization=your-org
sonar.host.url=https://sonarcloud.io

# Project information
sonar.projectName=Multi-Tenant SaaS API
sonar.projectVersion=1.0

# Source code location
sonar.sources=MultiTenantSaaS.API,MultiTenantSaaS.Core,MultiTenantSaaS.Infrastructure
sonar.tests=MultiTenantSaaS.Tests

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/*.Designer.cs
sonar.test.exclusions=**/*Tests.cs

# Coverage settings
sonar.cs.opencover.reportsPaths=**/coverage.cobertura.xml
sonar.coverage.exclusions=**/Migrations/**,**/*Tests.cs,**/Program.cs

# Language
sonar.language=cs

# Additional settings
sonar.sourceEncoding=UTF-8
	